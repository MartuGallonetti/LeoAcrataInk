<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />

        <link rel="icon" type="image/png" href="/logo.png" />

        <link
            rel="preload"
            href="/calaveraPrecarga.webp"
            as="image"
            type="image/webp"
            fetchpriority="high"
        />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Leo Acrata | Tattoo Artist</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Manrope:wght@200;300;400;500;600&display=swap"
            rel="stylesheet"
        />

        <style>
            html,
            body {
                margin: 0;
                background: #000;
            }

            #initial-loader {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #000;
                opacity: 1;
                visibility: visible;
                transition:
                    opacity 350ms ease-out,
                    visibility 350ms ease-out;
            }

            #initial-loader.is-hiding {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .initial-loader__image-wrapper {
                position: relative;
                animation: loader-pulse 1.4s ease-in-out infinite;
            }

            .initial-loader__glow {
                position: absolute;
                inset: 0;
                border-radius: 9999px;
                background: #7f1d1d;
                opacity: 0.3;
                filter: blur(48px);
                transform: scale(1.5);
            }

            .initial-loader__image {
                position: relative;
                z-index: 1;
                display: block;
                width: 160px;
                height: 160px;
                object-fit: contain;
                filter: drop-shadow(0 25px 25px rgb(0 0 0 / 0.5));
            }

            .initial-loader__text {
                margin: 32px 0 0;
                color: #991b1b;
                font-family: "Cinzel", serif;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.5em;
                text-transform: uppercase;
                animation: text-pulse 1.4s ease-in-out infinite;
            }

            @keyframes loader-pulse {
                0%,
                100% {
                    opacity: 0.85;
                    transform: scale(1);
                }

                50% {
                    opacity: 1;
                    transform: scale(1.08);
                }
            }

            @keyframes text-pulse {
                0%,
                100% {
                    opacity: 0.55;
                }

                50% {
                    opacity: 1;
                }
            }

            @media (max-width: 767px) {
                .initial-loader__image {
                    width: 128px;
                    height: 128px;
                }

                .initial-loader__text {
                    font-size: 10px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .initial-loader__image-wrapper,
                .initial-loader__text {
                    animation: none;
                }
            }
        </style>
    </head>

    <body>
        <div id="initial-loader" role="status" aria-label="Cargando sitio">
            <div class="initial-loader__image-wrapper">
                <div class="initial-loader__glow"></div>

                <img
                    src="/calaveraPrecarga.webp"
                    alt=""
                    width="160"
                    height="160"
                    fetchpriority="high"
                    class="initial-loader__image"
                />
            </div>

            <p class="initial-loader__text">Cargando...</p>
        </div>

        <div id="root"></div>

        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
